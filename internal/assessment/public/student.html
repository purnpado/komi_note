<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.DomainName}} 확인</title>
<style>
:root{color:#382319;font-family:system-ui,sans-serif}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#ffe7b5 0,transparent 36%),#f8f1e8}
.card{max-width:640px;margin:5vh auto;padding:clamp(24px,6vw,42px);border:1px solid #edbd83;border-radius:30px;background:#fffdf9;box-shadow:0 24px 58px #784b2322}
h1{font-size:clamp(28px,7vw,44px);line-height:1.18;margin:8px 0 22px}
.eyebrow{margin:0;color:#b36520;font-size:14px;font-weight:850;letter-spacing:.02em}
.notice{margin:0 0 26px;padding:15px 17px;border-radius:16px;background:#fff0d6;line-height:1.65}
.student-heading{margin:0 0 15px;font-size:clamp(21px,5vw,29px)}
.domain{padding:18px;border:1px solid #f2d4a6;border-radius:20px;background:linear-gradient(145deg,#fff8eb,#fff1d6)}
.criterion{margin:10px 0 0;padding:15px;border-radius:14px;background:#fffdf9;border:1px solid #f1ddc1}
.total{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;padding:14px 16px;border-radius:14px;background:#fffdf9;border:2px solid #e8b06c}
.total span{flex:1;font-weight:800}
.total strong{font-size:26px;color:#b5520f}
.total small{color:#765d4c}
.answer{margin:9px 0 0;padding:12px;border-left:4px solid #ce6916;border-radius:8px;background:#fff5e8;line-height:1.6}
.answer strong{display:block;margin-bottom:3px}
.answer p{margin:6px 0}
.muted{color:#765d4c}
.error{margin:8px 0;color:#a33a16;font-weight:750}
input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:14px;padding:15px;margin:8px 0}
input,textarea{border:1px solid #c79c75;background:#fff}
button{border:0;background:linear-gradient(135deg,#dd7b22,#bd5312);box-shadow:0 4px 0 #9c4210;color:white;font-weight:850}
@media(max-width:480px){.card{margin:0;min-height:100vh;border-radius:0;border:0;padding:28px 20px}
}
</style>
<main class="card" id="app">
<p class="eyebrow">{{.DomainName}} · {{if .AnswerOnly}}이의 답변 재확인{{else}}개인 점수 확인{{end}}</p>
<h1>{{.Title}}</h1>
<p class="notice">{{if .AnswerOnly}}본인 수업 반·번호와 이름을 입력하면 교사의 이의 답변만 확인할 수 있습니다. 확인 뒤에는 이 화면이 자동으로 닫힙니다.{{else}}본인 수업 반·번호와 이름을 입력하면 이 평가 영역의 본인 점수와 채점 사유만 확인할 수 있습니다. 확인 또는 이의 제출 뒤에는 이 화면이 자동으로 닫힙니다.{{end}}</p>
<div id="content">불러오는 중입니다.</div>
</main>
<script>
const token={{.Token}},api='/assessment-api/'+token,initialAuthenticated={{.Authenticated}},answerOnly={{.AnswerOnly}};async function call(path,body){const r=await fetch(api+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text()||'요청을 처리하지 못했습니다.');return r.json()}
async function state(){const r=await fetch(api+'/state',{cache:'no-store'});if(!r.ok)throw new Error('확인 정보를 불러오지 못했습니다. 교사에게 QR 회차 상태를 확인해 달라고 알려 주세요.');return r.json()}
function esc(v){return String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function failure(message){const box=document.querySelector('#content');box.innerHTML='<h2>연결을 확인해 주세요</h2><p>'+esc(message)+'</p><button id="retry">다시 시도</button>';document.querySelector('#retry').onclick=render}
function showLogin(){const box=document.querySelector('#content');box.innerHTML='<label>수업 반·번호<input id="number" inputmode="numeric" placeholder="예: 7 (번호만 입력)"></label><label>이름<input id="name" autocomplete="name"></label><button id="login">'+(answerOnly?'내 답변 확인':'내 점수 확인')+'</button>';document.querySelector('#login').onclick=async()=>{try{await call('/login',{number:document.querySelector('#number').value,name:document.querySelector('#name').value});render()}catch(e){failure(e.message)}}}
function showObjection(){const box=document.querySelector('#content');box.innerHTML='<h2>이의 내용</h2><textarea id="objection-content" rows="6" placeholder="확인이 필요한 내용을 구체적으로 입력해 주세요."></textarea><p id="objection-error" class="error" role="alert"></p><button id="submit">이의 제출</button>';document.querySelector('#submit').onclick=async()=>{const input=document.querySelector('#objection-content'),error=document.querySelector('#objection-error'),content=input.value.trim();if(!content){error.textContent='이의 내용을 입력해 주세요.';input.focus();return}try{await call('/objection',{content});render()}catch(e){error.textContent=e.message||'이의 내용을 제출하지 못했습니다. 잠시 후 다시 시도해 주세요.'}}}
async function render(){const box=document.querySelector('#content');try{const data=await state();if(data.closed||data.completed){box.innerHTML='<h2>확인이 완료되었습니다</h2><p>창을 닫아 주세요.</p>';return}if(data.paused){box.innerHTML='<h2>잠시 기다려 주세요</h2><p>교사가 확인 회차를 일시정지했습니다.</p>';return}if(!data.authenticated){showLogin();return}if(data.answerOnly){const rows=data.objections.map(o=>'<article class="criterion"><strong>내 이의 내용</strong><p>'+esc(o.content)+'</p><div class="answer"><strong>교사 답변</strong>'+esc(o.answer)+'</div></article>').join('');box.innerHTML='<h2 class="student-heading">'+esc(data.student.number)+'번 '+esc(data.student.name)+' 학생의 답변</h2><section class="domain">'+rows+'</section><button id="complete">답변 확인했어요</button>';document.querySelector('#complete').onclick=async()=>{try{await call('/complete');render()}catch(e){failure(e.message)}};return}const d=data.domain,crit=d.criteria||[],rows=crit.map(c=>'<article class="criterion"><strong>'+esc(c.name)+'</strong><p>'+(c.score==null?'미입력':c.score+'점')+' / '+c.maxScore+'점</p><div class="answer"><strong>채점 사유</strong>'+esc(c.reason||'채점 사유가 아직 입력되지 않았습니다.')+'</div></article>').join('');const scored=crit.filter(c=>c.score!=null),sum=scored.reduce((a,c)=>a+Number(c.score),0),sumMax=crit.reduce((a,c)=>a+Number(c.maxScore),0);let summary='';if(d.importedScore!=null)summary+='<div class="total"><span>나이스 영역 점수</span><strong>'+d.importedScore+'점</strong><small>/ '+d.maxScore+'점</small></div>';if(crit.length)summary+='<div class="total"><span>세부 기준 합계'+(scored.length<crit.length?' (일부 미입력)':'')+'</span><strong>'+sum+'점</strong><small>/ '+sumMax+'점</small></div>';const heading='<h2 class="student-heading">'+esc(data.student.number)+'번 '+esc(data.student.name)+' 학생</h2>';if(!summary&&!crit.length){box.innerHTML=heading+'<section class="domain"><p class="muted">아직 공개된 점수가 없습니다. 선생님께 말씀해 주세요.</p></section><p class="muted">점수가 입력되면 다시 QR로 확인할 수 있습니다. 이 창을 닫아도 됩니다.</p>';return}box.innerHTML=heading+'<section class="domain">'+summary+rows+'</section><button id="complete">확인했어요</button>'+(data.hasOpenObjection?'<p class="muted">이 영역에 낸 이의를 선생님이 확인하고 있습니다.</p>':'<button id="objection">이의가 있어요</button>');document.querySelector('#complete').onclick=async()=>{try{await call('/complete');render()}catch(e){failure(e.message)}};const ob=document.querySelector('#objection');if(ob)ob.onclick=showObjection}catch(e){failure(e.message||'학생 점수 확인 서버에 연결하지 못했습니다.')}}initialAuthenticated?render():showLogin()
</script></html>
