<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · 전자칠판</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1f3d34;color:#fff;font:clamp(18px,1.8vw,26px)/1.45 Pretendard,system-ui,sans-serif}
main{width:min(1200px,94vw);margin:0 auto;padding:4vh 0}
.eyebrow{margin:0;color:#ffd98a;font-weight:800}
h1{margin:.2em 0 .5em;font-size:clamp(34px,4.6vw,64px);line-height:1.15;word-break:keep-all}
.join{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:4vh 4vw;border:3px solid #e8bf64;border-radius:28px;background:#123129}
.qr{width:min(340px,40vw);border:14px solid #fff;border-radius:20px;background:#fff}
.url{overflow-wrap:anywhere;color:#cfe6ff;font-size:clamp(20px,2.2vw,34px);font-weight:800}
.count{margin-top:1.2em;font-size:clamp(24px,2.6vw,40px);color:#ffebc5}
.count b{color:#fff}
.message{padding:5vh 4vw;border-radius:28px;background:#123129;text-align:center;font-size:clamp(26px,3vw,44px)}
.result{margin:0 0 22px;padding:22px 26px;border-radius:22px;background:#123129}
.result h2{margin:0 0 14px;font-size:clamp(22px,2.2vw,32px)}
.bar{display:grid;grid-template-columns:minmax(120px,30%) 1fr 4.5em;gap:14px;align-items:center;margin:8px 0}
.track{height:28px;border-radius:14px;background:#2c5a4c;overflow:hidden}
.fill{height:100%;background:#ffcf6b;border-radius:14px}
.num{text-align:right;font-weight:800}
.avg{margin:0 0 8px;color:#ffd98a;font-weight:800}
.muted{color:#b9d2c7}
@media (max-width:760px){.join{grid-template-columns:1fr;text-align:center}.qr{margin:auto}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
</style>
</head>
<body>
<main>
<p class="eyebrow">꼬미노트 설문 · 전자칠판</p>
<h1 id="boardTitle">{{.Title}}</h1>
<div id="boardBody"></div>
</main>
<script>
const boardApi='/api/{{.Token}}';
const boardStudentURL={{.StudentURL}};
const boardBody=document.getElementById('boardBody');
let boardMode='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function joinView(d){
  if(boardMode!=='join'){boardBody.innerHTML='<section class="join"><img class="qr" src="'+boardApi+'/qr" alt="설문 참여 QR 코드"><div><p class="url">'+esc(boardStudentURL)+'</p><p class="count" id="boardCount"></p><p class="muted" id="boardStage"></p></div></section>';boardMode='join'}
  const expected=d.expectedParticipants>0?' / 대상 <b>'+d.expectedParticipants+'</b>명':'';
  document.getElementById('boardCount').innerHTML='참여 확인 <b>'+d.participants+'</b>명'+expected+' · 응답 <b>'+d.responses+'</b>명';
  document.getElementById('boardStage').textContent=d.paused?'선생님이 잠시 멈췄습니다.':d.started?'설문이 진행 중입니다. 화면의 문항에 답해 주세요.':'번호와 이름으로 참여한 뒤 기다려 주세요.';
}
function resultView(d){
  boardMode='result';
  boardBody.innerHTML=(d.results||[]).map((q,i)=>{
    if(q.textOnly)return '<section class="result"><h2>'+(i+1)+'. '+esc(q.text)+'</h2><p class="muted">글로 쓴 답은 선생님 화면에서만 봅니다.</p></section>';
    const total=Object.values(q.counts||{}).reduce((a,b)=>a+b,0)||1;
    const avg=q.average!=null?'<p class="avg">평균 '+q.average.toFixed(2)+'점</p>':'';
    return '<section class="result"><h2>'+(i+1)+'. '+esc(q.text)+'</h2>'+avg+(q.options||[]).map(o=>{const c=(q.counts||{})[o]||0;return '<div class="bar"><span>'+esc(o)+'</span><div class="track"><div class="fill" style="width:'+Math.round(c/total*100)+'%"></div></div><span class="num">'+c+'명</span></div>'}).join('')+'</section>';
  }).join('')||'<p class="message">공개할 결과가 없습니다.</p>';
}
async function loadBoard(){
  let d;
  try{d=await fetch(boardApi+'/state',{cache:'no-store'}).then(r=>r.json())}catch(e){return}
  document.getElementById('boardTitle').textContent=d.title;
  if(d.closed&&d.publicResults){if(boardMode!=='result')resultView(d);return}
  if(d.closed){if(boardMode!=='closed'){boardBody.innerHTML='<p class="message">설문이 마감되었습니다. 참여해 주셔서 고맙습니다.</p>';boardMode='closed'}return}
  joinView(d);
}
loadBoard();
setInterval(loadBoard,2000);
</script>
</body>
</html>
